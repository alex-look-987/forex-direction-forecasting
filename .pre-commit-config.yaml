  - repo: https://github.com/mwouts/jupytext
    rev: v1.19.3
    hooks:
      - id: jupytext
        args: [--sync]
        files: \.ipynb$
  
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff-check
      - id: ruff-format
